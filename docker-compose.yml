services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: euro24_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d euro24_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion:
    build: .
    profiles: ["ingest"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATA_SOURCE: live
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: euro24_db
      DB_USER: postgres
      DB_PASSWORD: postgres

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: euro24_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8501:8501"
    volumes:
      - ./src/dashboard:/app/dashboard

volumes:
  pgdata: